<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contemporary World — Midterm Reviewer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0c0d10;
  --s1:#13141a;
  --s2:#1a1c25;
  --s3:#22253300;
  --bdr:#252833;
  --bdr2:#2e3244;
  --txt:#eae6df;
  --muted:#686c85;
  --acc:#c8965a;
  --acc2:rgba(200,150,90,0.13);
  --grn:#52c07a;
  --red:#e06b6b;
  --org:#e0924b;
  --blu:#5b93c8;
  --gry:#7a8399;
  --rad:16px;
  --fn:'Source Serif 4',Georgia,serif;
  --fnd:'Playfair Display',Georgia,serif;
}

body{background:var(--bg);color:var(--txt);font-family:var(--fn);min-height:100vh;
  background-image:
    radial-gradient(ellipse 70% 40% at 20% -10%,rgba(200,150,90,0.06) 0%,transparent 60%),
    radial-gradient(ellipse 50% 30% at 80% 110%,rgba(91,147,200,0.04) 0%,transparent 60%);
}

/* ─── TAB NAV ─── */
.tab-nav{
  display:flex;align-items:center;gap:0;
  border-bottom:1px solid var(--bdr);
  background:var(--s1);
  position:sticky;top:0;z-index:100;
  padding:0 20px;
}
.tab-nav-title{
  font-family:var(--fnd);font-size:0.95rem;color:var(--acc);
  padding:14px 0;margin-right:28px;white-space:nowrap;letter-spacing:0.01em;
}
.tab-btn{
  padding:14px 18px;font-family:var(--fn);font-size:0.8rem;font-weight:600;
  color:var(--muted);border:none;background:none;cursor:pointer;
  border-bottom:2px solid transparent;transition:all 0.2s;white-space:nowrap;
  letter-spacing:0.04em;text-transform:uppercase;
}
.tab-btn:hover{color:var(--txt);}
.tab-btn.active{color:var(--acc);border-bottom-color:var(--acc);}

/* ─── PANELS ─── */
.panel{display:none;padding:28px 20px 80px;}
.panel.active{display:block;}
.wrap{max-width:680px;margin:0 auto;}

/* ─── STATS ─── */
.stats-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.sp{
  display:flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:99px;
  font-size:0.73rem;font-weight:600;
  background:var(--s1);border:1px solid var(--bdr);color:var(--muted);
}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.da{background:var(--muted);}
.dm{background:var(--grn);}
.dr{background:var(--org);}
.dp{background:var(--acc);}

/* Progress */
.pb-wrap{height:3px;background:var(--s2);border-radius:99px;overflow:hidden;margin:10px 0 4px;}
.pb-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--org));border-radius:99px;transition:width .5s ease;}
.pb-lbl{font-size:0.7rem;color:var(--muted);}

/* ─── CONTROLS ─── */
.ctrls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;}
.tog-btn{
  display:flex;align-items:center;gap:8px;
  padding:7px 14px;border-radius:99px;font-size:0.75rem;font-weight:600;
  border:1px solid var(--bdr);background:var(--s1);color:var(--muted);
  cursor:pointer;transition:all .2s;font-family:var(--fn);
}
.tog-btn:hover{border-color:var(--acc);color:var(--txt);}
.tog-btn.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);}
.trk{width:28px;height:16px;background:var(--bdr);border-radius:99px;position:relative;transition:background .2s;flex-shrink:0;}
.trk.on{background:var(--acc);}
.trk::after{content:'';position:absolute;width:12px;height:12px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s;}
.trk.on::after{left:14px;}
.rst-btn{
  padding:7px 14px;border-radius:99px;font-size:0.75rem;font-weight:600;
  border:1px solid var(--bdr);background:var(--s1);color:var(--muted);
  cursor:pointer;transition:all .2s;font-family:var(--fn);
}
.rst-btn:hover{border-color:var(--red);color:var(--red);}

/* ─── TOPIC FILTER ─── */
.tf{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0;}
.tf-btn{
  padding:4px 11px;border-radius:7px;font-size:0.71rem;font-weight:600;
  border:1px solid var(--bdr);background:transparent;color:var(--muted);
  cursor:pointer;transition:all .18s;font-family:var(--fn);
}
.tf-btn:hover{border-color:var(--acc);color:var(--txt);}
.tf-btn.sel{background:var(--acc2);border-color:var(--acc);color:var(--acc);}

/* ─── CARD ─── */
.card{
  background:var(--s1);border:1px solid var(--bdr);
  border-radius:var(--rad);padding:30px 28px 24px;
  display:flex;flex-direction:column;gap:20px;
  box-shadow:0 8px 40px rgba(0,0,0,0.35);
  animation:cUp .3s ease;
}
@keyframes cUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

.card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.badge{
  padding:3px 9px;border-radius:7px;
  font-size:0.66rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;
}
.bd-topic{ background:var(--s2);color:var(--muted);border:1px solid var(--bdr2); }
.bd-rev{   background:rgba(224,146,75,0.12);color:var(--org);border:1px solid rgba(224,146,75,0.28); }
.bd-e1{    background:rgba(82,192,122,0.1); color:var(--grn);border:1px solid rgba(82,192,122,0.25); }
.t-rev  {background:rgba(200,150,90,.13);  color:#d4a96a;}
.t-mal  {background:rgba(82,192,122,.13);  color:#7ddfa0;}
.t-con  {background:rgba(91,147,200,.13);  color:#8db8e0;}
.t-tax  {background:rgba(193,99,99,.13);   color:#e0a0a0;}
.t-jud  {background:rgba(148,100,200,.13); color:#c9a8f0;}

.q-text{
  font-family:var(--fn);
  font-style:normal;
  font-size:1.18rem;
  line-height:1.65;
  color:var(--txt);
}

/* answer */
.ans-area{overflow:hidden;transition:max-height .4s ease,opacity .35s ease;max-height:0;opacity:0;}
.ans-area.open{max-height:800px;opacity:1;}
.ans-divider{height:1px;background:var(--bdr);margin-bottom:14px;}
.ans-label{font-size:0.67rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--acc);margin-bottom:10px;}
.ans-text{font-size:1.05rem;font-weight:600;color:var(--txt);line-height:1.55;font-family:var(--fn);}

/* ─── BUTTONS ─── */
.btn-chk{
  width:100%;padding:14px;border-radius:12px;
  font-size:0.93rem;font-weight:700;font-family:var(--fn);letter-spacing:0.02em;
  border:1.5px solid var(--acc);background:var(--acc2);color:var(--acc);
  cursor:pointer;transition:all .2s;
}
.btn-chk:hover{background:var(--acc);color:#0c0d10;}

.rate-row{display:none;gap:8px;margin-top:12px;}
.rate-row.show{display:flex;}
.rb{
  flex:1;padding:11px 6px;border-radius:10px;
  font-size:0.76rem;font-weight:700;font-family:var(--fn);
  cursor:pointer;border:1.5px solid transparent;
  transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:4px;
}
.rb span{font-size:1rem;}
.rb-e{background:rgba(82,192,122,.1); border-color:rgba(82,192,122,.28);color:var(--grn);}
.rb-e:hover{background:rgba(82,192,122,.22);border-color:var(--grn);}
.rb-h{background:rgba(224,146,75,.1); border-color:rgba(224,146,75,.28);color:var(--org);}
.rb-h:hover{background:rgba(224,146,75,.22);border-color:var(--org);}
.rb-m{background:rgba(224,107,107,.1);border-color:rgba(224,107,107,.28);color:var(--red);}
.rb-m:hover{background:rgba(224,107,107,.22);border-color:var(--red);}
.rb-o{background:rgba(122,131,153,.1);border-color:rgba(122,131,153,.28);color:var(--gry);}
.rb-o:hover{background:rgba(122,131,153,.22);border-color:var(--gry);}

/* done */
.done-scr{
  display:none;text-align:center;padding:60px 24px;
  background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rad);
}
.done-scr h2{font-family:var(--fnd);font-size:2rem;color:var(--acc);margin-bottom:10px;}
.done-scr p{color:var(--muted);font-size:0.9rem;line-height:1.7;}

.sess-info{text-align:center;font-size:0.7rem;color:var(--muted);margin-top:10px;}

.legend{margin-top:18px;display:flex;gap:14px;flex-wrap:wrap;}
.lg{display:flex;align-items:center;gap:5px;font-size:0.68rem;color:var(--muted);}
.lg-d{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* ═══════════════════════════════════════
   Q&A REVIEWER PANEL
═══════════════════════════════════════ */
.qa-section{margin-bottom:44px;}
.qa-section-title{
  font-family:var(--fnd);font-size:1.3rem;color:var(--acc);
  margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid var(--bdr);
}
.qa-item{
  background:var(--s1);border:1px solid var(--bdr);border-radius:12px;
  margin-bottom:10px;overflow:hidden;transition:border-color .2s;
}
.qa-item:hover{border-color:var(--bdr2);}
.qa-q{
  padding:16px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
}
.qa-q-text{
  font-family:var(--fn);
  font-style:normal;
  font-size:0.98rem;
  line-height:1.55;
  color:var(--txt);
  flex:1;
}
.qa-q-num{
  font-size:0.7rem;font-weight:700;color:var(--muted);white-space:nowrap;padding-top:3px;flex-shrink:0;
}
.qa-chevron{color:var(--muted);font-size:0.75rem;flex-shrink:0;transition:transform .25s;padding-top:2px;}
.qa-item.open .qa-chevron{transform:rotate(180deg);}
.qa-a{
  overflow:hidden;max-height:0;transition:max-height .35s ease,padding .3s ease;
  padding:0 20px;
}
.qa-item.open .qa-a{max-height:400px;padding:0 20px 16px;}
.qa-a-label{font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--acc);margin-bottom:8px;}
.qa-a-text{font-size:0.97rem;font-weight:600;color:var(--txt);line-height:1.5;font-family:var(--fn);}
.qa-divider{height:1px;background:var(--bdr);margin:0 20px 12px;}

.qa-search{
  width:100%;padding:11px 16px;background:var(--s1);border:1px solid var(--bdr);
  border-radius:10px;font-size:0.9rem;font-family:var(--fn);color:var(--txt);
  margin-bottom:20px;transition:border-color .2s;
}
.qa-search:focus{outline:none;border-color:var(--acc);}
.qa-search::placeholder{color:var(--muted);}

.qa-reveal-all{
  padding:8px 18px;border-radius:99px;font-size:0.74rem;font-weight:700;font-family:var(--fn);
  border:1px solid var(--bdr);background:var(--s1);color:var(--muted);
  cursor:pointer;margin-bottom:22px;margin-right:8px;transition:all .2s;
}
.qa-reveal-all:hover{border-color:var(--acc);color:var(--acc);}
.qa-collapse-all{
  padding:8px 18px;border-radius:99px;font-size:0.74rem;font-weight:700;font-family:var(--fn);
  border:1px solid var(--bdr);background:var(--s1);color:var(--muted);
  cursor:pointer;margin-bottom:22px;transition:all .2s;
}
.qa-collapse-all:hover{border-color:var(--red);color:var(--red);}

@media(max-width:500px){
  .card{padding:22px 16px 20px;}
  .q-text{font-size:1rem;}
  .rb{font-size:0.69rem;padding:10px 4px;}
  .panel{padding:20px 14px 60px;}
}
</style>
</head>
<body>

<!-- TAB NAV -->
<nav class="tab-nav">
  <div class="tab-nav-title">🇵🇭 Midterm</div>
  <button class="tab-btn active" onclick="switchTab('trainer')">Memory Trainer</button>
  <button class="tab-btn" onclick="switchTab('qa')">Q&amp;A Reviewer</button>
</nav>

<!-- ══════════════════════════════════════════
     PANEL 1: MEMORY TRAINER
══════════════════════════════════════════ -->
<div class="panel active" id="panel-trainer">
<div class="wrap">

  <div class="stats-row">
    <div class="sp"><div class="dot da"></div><span id="s-tot">0 total</span></div>
    <div class="sp"><div class="dot dm"></div><span id="s-mas">0 mastered</span></div>
    <div class="sp"><div class="dot dr"></div><span id="s-rev">0 to review</span></div>
    <div class="sp"><div class="dot dp"></div><span id="s-pend">0 pending</span></div>
  </div>

  <div class="pb-wrap"><div class="pb-fill" id="pb-fill" style="width:0%"></div></div>
  <div class="pb-lbl" id="pb-lbl">0% mastered</div>

  <div class="ctrls">
    <button class="tog-btn" id="rnd-btn" onclick="toggleRandom()">
      <div class="trk" id="rnd-trk"></div>Random Order
    </button>
    <button class="rst-btn" onclick="doReset()">↺ Reset</button>
  </div>

  <div class="tf">
    <button class="tf-btn sel" data-top="all"         onclick="setFilter(this)">All Topics</button>
    <button class="tf-btn"     data-top="Revolution"  onclick="setFilter(this)">Revolution</button>
    <button class="tf-btn"     data-top="Malolos"     onclick="setFilter(this)">Malolos</button>
    <button class="tf-btn"     data-top="Constitutions" onclick="setFilter(this)">Constitutions</button>
    <button class="tf-btn"     data-top="Taxation"    onclick="setFilter(this)">Taxation</button>
    <button class="tf-btn"     data-top="Judiciary"   onclick="setFilter(this)">Judiciary</button>
  </div>

  <!-- Main card -->
  <div class="card" id="main-card">
    <div class="card-meta" id="card-meta"></div>
    <div class="q-text" id="q-text">Loading…</div>
    <div class="ans-area" id="ans-area">
      <div class="ans-divider"></div>
      <div class="ans-label">Answer</div>
      <div class="ans-text" id="ans-text"></div>
    </div>
    <div>
      <button class="btn-chk" id="btn-chk" onclick="checkAnswer()">Reveal Answer</button>
      <div class="rate-row" id="rate-row">
        <button class="rb rb-e" onclick="rate('easy')"><span>✓</span>Easy</button>
        <button class="rb rb-h" onclick="rate('hard')"><span>~</span>Hard</button>
        <button class="rb rb-m" onclick="rate('missed')"><span>✗</span>Missed</button>
        <button class="rb rb-o" onclick="rate('other')"><span>?</span>Other</button>
      </div>
    </div>
  </div>

  <div class="done-scr" id="done-scr">
    <h2>🎉 All Mastered!</h2>
    <p>You answered every item correctly twice in a row.<br>You're ready for the midterm — great work!</p>
    <br>
    <button class="rst-btn" style="margin:0 auto;display:block;" onclick="doReset()">Start Over</button>
  </div>

  <div class="sess-info" id="sess-info"></div>

  <div class="legend">
    <div class="lg"><div class="lg-d" style="background:var(--grn)"></div>Easy × 2 in a row = mastered</div>
    <div class="lg"><div class="lg-d" style="background:var(--org)"></div>Hard / Other = return in 7–10 Qs</div>
    <div class="lg"><div class="lg-d" style="background:var(--red)"></div>Missed = return in 4–7 Qs</div>
  </div>
</div>
</div>

<!-- ══════════════════════════════════════════
     PANEL 2: Q&A REVIEWER
══════════════════════════════════════════ -->
<div class="panel" id="panel-qa">
<div class="wrap">

  <input class="qa-search" type="text" placeholder="Search questions or answers…" oninput="qaSearch(this.value)" id="qa-search-input">
  <button class="qa-reveal-all" onclick="qaRevealAll()">Reveal All Answers</button>
  <button class="qa-collapse-all" onclick="qaCollapseAll()">Collapse All</button>

  <div id="qa-content"></div>
</div>
</div>

<!-- ══════════════════════════════════════════
     SCRIPT
══════════════════════════════════════════ -->
<script>
// ─────────────────────────────────────────
// DATA  (80 Q&A items, exactly as given)
// ─────────────────────────────────────────
const DATA = [
  // ── Revolution & Agreements (1–20) ──
  {id:1, top:"Revolution", q:"What was the temporary constitution used to support the revolutionary government during the war against Spain?", a:"The Pact / Constitution of Biak-na-Bato."},
  {id:2, top:"Revolution", q:"What was the main goal stated in the Biak-na-Bato Constitution?", a:"The total separation of the Philippines from the Spanish monarchy and the creation of an independent Philippine republic."},

  {id:8, top:"Revolution", q:"Who was the leader associated with the Philippine Declaration of Independence?", a:"Emilio Aguinaldo."},
  {id:9, top:"Revolution", q:"Who read the act of the Philippine Declaration of Independence?", a:"Ambrosio Rianzares Bautista."},
  {id:10,top:"Revolution", q:"What treaty later ignored the Philippine Declaration of Independence?", a:"The Treaty of Paris of 1898."},
  {id:11,top:"Revolution", q:"What did the Treaty of Paris of 1898 do?", a:"It ended the Spanish-American War and ceded the Philippines, Puerto Rico, and Guam to the United States for $20 million."},

  {id:21,top:"Malolos", q:"What is the Malolos Constitution often called?", a:"The first republican constitution in Asia."},

  // ── Philippine Constitutions (33–50) ──
  {id:33,top:"Constitutions", q:"What constitution belonged to the Commonwealth Government?", a:"The 1935 Philippine Constitution."},
  {id:34,top:"Constitutions", q:"What system of government did the 1935 Constitution use?", a:"A presidential system."},
  {id:35,top:"Constitutions", q:"What major political principle was used in the 1935 Constitution?", a:"Separation of powers."},

  {id:37,top:"Constitutions", q:"What constitution belonged to the Japanese-sponsored Republic?", a:"The 1943 Philippine Constitution."},
  {id:38,top:"Constitutions", q:"What kind of government did the 1943 Constitution use?", a:"A parliamentary-style government."},
  {id:39,top:"Constitutions", q:"Who was associated with the 1943 Constitution?", a:"Jose P. Laurel."},

// ─────────────────────────────────────────
// TOPIC helpers
// ─────────────────────────────────────────
const TOPIC_CLASS = {
  "Revolution":"t-rev","Malolos":"t-mal","Constitutions":"t-con",
  "Taxation":"t-tax","Judiciary":"t-jud"
};
function topClass(t){ return TOPIC_CLASS[t]||""; }

// ─────────────────────────────────────────
// MEMORY TRAINER STATE
// ─────────────────────────────────────────
const S={
  allItems:[],pendingQ:[],reviewPool:[],
  current:null,answered:false,qCount:0,
  randomOrder:false,filter:'all',
  burst:false,burstQ:[],nextBurstAt:8,busy:false
};

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}

function initItems(filter){
  S.filter=filter;
  const src=DATA.filter(r=>filter==='all'||r.top===filter);
  S.allItems=src.map(r=>({...r,easyStreak:0,status:'pending',reviewAt:null}));
  S.pendingQ=[...S.allItems];
  if(S.randomOrder)shuffle(S.pendingQ);
  S.reviewPool=[];S.qCount=0;S.burst=false;S.burstQ=[];
  S.nextBurstAt=rnd(7,10);S.answered=false;S.current=null;
}

function nextQ(){
  S.answered=false;S.busy=false;
  if(S.burst){
    if(S.burstQ.length>0){S.current=S.burstQ.shift();render();return;}
    S.burst=false;S.nextBurstAt=S.qCount+rnd(7,10);
  }
  const ready=S.reviewPool.filter(i=>i.reviewAt<=S.qCount&&i.status!=='mastered');
  if(S.qCount>=S.nextBurstAt&&ready.length>0){
    const burst=ready.slice(0,Math.min(5,ready.length));
    burst.forEach(b=>{S.reviewPool=S.reviewPool.filter(i=>i.id!==b.id);});
    S.burstQ=burst;S.burst=true;
    S.current=S.burstQ.shift();render();return;
  }
  if(S.pendingQ.length>0){S.current=S.pendingQ.shift();render();return;}
  if(S.reviewPool.length>0){
    S.reviewPool.sort((a,b)=>a.reviewAt-b.reviewAt);
    S.current=S.reviewPool.shift();render();return;
  }
  S.current=null;renderDone();
}

function checkAnswer(){
  if(S.busy)return;
  S.answered=true;render();
}

function rate(r){
  if(S.busy||!S.answered)return;
  S.busy=true;
  const item=S.current;
  if(r==='easy'){
    item.easyStreak++;
    if(item.easyStreak>=2){item.status='mastered';}
    else{item.status='review';item.reviewAt=S.qCount+rnd(7,10);
      S.reviewPool=S.reviewPool.filter(i=>i.id!==item.id);S.reviewPool.push(item);}
  } else if(r==='missed'){
    item.easyStreak=0;item.status='review';item.reviewAt=S.qCount+rnd(4,7);
    S.reviewPool=S.reviewPool.filter(i=>i.id!==item.id);S.reviewPool.push(item);
  } else {
    item.easyStreak=0;item.status='review';item.reviewAt=S.qCount+rnd(7,10);
    S.reviewPool=S.reviewPool.filter(i=>i.id!==item.id);S.reviewPool.push(item);
  }
  S.qCount++;nextQ();
}

function toggleRandom(){
  S.randomOrder=!S.randomOrder;
  document.getElementById('rnd-trk').className='trk'+(S.randomOrder?' on':'');
  document.getElementById('rnd-btn').className='tog-btn'+(S.randomOrder?' on':'');
  if(S.randomOrder)shuffle(S.pendingQ);
}

function setFilter(btn){
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  initItems(btn.dataset.top);
  document.getElementById('done-scr').style.display='none';
  document.getElementById('main-card').style.display='';
  nextQ();updateStats();
}

function doReset(){
  if(!confirm('Reset all progress?'))return;
  initItems(S.filter);
  document.getElementById('done-scr').style.display='none';
  document.getElementById('main-card').style.display='';
  nextQ();updateStats();
}

function updateStats(){
  const total=S.allItems.length;
  const mastered=S.allItems.filter(i=>i.status==='mastered').length;
  const rev=S.reviewPool.length;
  const pend=S.pendingQ.length;
  const pct=total?Math.round(mastered/total*100):0;
  document.getElementById('s-tot').textContent=total+' total';
  document.getElementById('s-mas').textContent=mastered+' mastered';
  document.getElementById('s-rev').textContent=rev+' to review';
  document.getElementById('s-pend').textContent=pend+' pending';
  document.getElementById('pb-fill').style.width=pct+'%';
  document.getElementById('pb-lbl').textContent=pct+'% mastered · Q#'+(S.qCount+1);
}

function render(){
  const item=S.current;if(!item)return;
  const card=document.getElementById('main-card');
  if(!S.answered){card.style.animation='none';void card.offsetWidth;card.style.animation='';}
  // meta
  const meta=document.getElementById('card-meta');
  let b=`<span class="badge ${topClass(item.top)}">${item.top}</span>`;
  b+=`<span class="badge bd-topic">Q${item.id}</span>`;
  if(S.burst||item.status==='review')b+=`<span class="badge bd-rev">↺ Review</span>`;
  if(item.easyStreak===1)b+=`<span class="badge bd-e1">1× Easy ✓</span>`;
  meta.innerHTML=b;
  document.getElementById('q-text').textContent=item.q;
  const aa=document.getElementById('ans-area');
  const bc=document.getElementById('btn-chk');
  const rr=document.getElementById('rate-row');
  if(S.answered){
    document.getElementById('ans-text').textContent=item.a;
    aa.classList.add('open');bc.style.display='none';rr.classList.add('show');
  } else {
    aa.classList.remove('open');bc.style.display='block';rr.classList.remove('show');
  }
  const rem=S.pendingQ.length+S.reviewPool.length+S.burstQ.length;
  document.getElementById('sess-info').textContent='Q#'+(S.qCount+1)+' · '+rem+' remaining';
  updateStats();
}

function renderDone(){
  document.getElementById('main-card').style.display='none';
  document.getElementById('done-scr').style.display='block';
  document.getElementById('sess-info').textContent='';
  updateStats();
}

// ─────────────────────────────────────────
// Q&A REVIEWER
// ─────────────────────────────────────────
const SECTIONS=[
  {title:"Revolution & Agreements",    top:"Revolution"},
  {title:"Malolos Republic",           top:"Malolos"},
  {title:"Philippine Constitutions",   top:"Constitutions"},
  {title:"Taxation & Agrarian Reform", top:"Taxation"},
  {title:"Judiciary & Supreme Court",  top:"Judiciary"},
];

function buildQA(){
  const cont=document.getElementById('qa-content');
  cont.innerHTML='';
  SECTIONS.forEach(sec=>{
    const items=DATA.filter(d=>d.top===sec.top);
    const div=document.createElement('div');
    div.className='qa-section';
    div.dataset.topic=sec.top;
    let html=`<div class="qa-section-title">${sec.title}</div>`;
    items.forEach(item=>{
      html+=`
      <div class="qa-item" id="qai-${item.id}" data-q="${esc(item.q)}" data-a="${esc(item.a)}">
        <div class="qa-q" onclick="toggleQA(${item.id})">
          <div class="qa-q-text">${item.q}</div>
          <span class="qa-q-num">#${item.id}</span>
          <span class="qa-chevron">▼</span>
        </div>
        <div class="qa-a">
          <div class="qa-divider"></div>
          <div class="qa-a-label">Answer</div>
          <div class="qa-a-text">${item.a}</div>
        </div>
      </div>`;
    });
    div.innerHTML=html;
    cont.appendChild(div);
  });
}

function esc(s){ return s.replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toggleQA(id){
  const el=document.getElementById('qai-'+id);
  el.classList.toggle('open');
}
function qaRevealAll(){
  document.querySelectorAll('.qa-item').forEach(el=>el.classList.add('open'));
}
function qaCollapseAll(){
  document.querySelectorAll('.qa-item').forEach(el=>el.classList.remove('open'));
}
function qaSearch(val){
  const v=val.toLowerCase();
  document.querySelectorAll('.qa-item').forEach(el=>{
    const q=el.dataset.q.toLowerCase();
    const a=el.dataset.a.toLowerCase();
    const match=!v||q.includes(v)||a.includes(v);
    el.style.display=match?'':'none';
    if(match&&v)el.classList.add('open');
  });
  // show/hide section headers
  document.querySelectorAll('.qa-section').forEach(sec=>{
    const vis=[...sec.querySelectorAll('.qa-item')].some(i=>i.style.display!=='none');
    sec.querySelector('.qa-section-title').style.display=vis?'':'none';
  });
}

// ─────────────────────────────────────────
// TAB SWITCHING
// ─────────────────────────────────────────
function switchTab(t){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active',['trainer','qa'][i]===t);
  });
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+t).classList.add('active');
}

// ─────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────
initItems('all');
nextQ();
buildQA();
</script>
